<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>My Documents</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-3 bg-white">
          <!-- sidenav -->
        </div>
        <div class="col-12 col-md-5 col-lg-9 bg-chat py-3">
          <div class="container p-30">
            <form action="" class="row">
              <h2 class="fw-medium mb-3">Account</h2>
              <h6 class="table-file-reading mb-4">
                Manage your account settings and preferences.
              </h6>
              <h5 class="fw-bold mb-3">Profile</h5>
              <div class="col-12 col-md-6 order-2 order-md-1">
                <div class="col-12 mb-3">
                  <div class="mb-1">
                    <label for="exampleFormControlInput1" class="form-label"
                      >First Name</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id=""
                      placeholder="John"
                    />
                  </div>
                </div>
                <div class="col-12 mb-3">
                  <div class="mb-1">
                    <label for="exampleFormControlInput1" class="form-label"
                      >Last Name</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id=""
                      placeholder="Smith"
                    />
                  </div>
                </div>
                <div class="col-12 mb-3">
                  <div class="mb-1">
                    <label for="exampleFormControlInput1" class="form-label"
                      >Email</label
                    >
                    <input
                      type="email"
                      class="form-control"
                      id=""
                      placeholder="Johnsmith@gmail.com"
                    />
                  </div>
                </div>
              </div>
              <div class="col-12 col-md-6 order-1 order-md-2">
                <div class="text-center">
                  <img
                    src="imgs/thumb.jpg"
                    class="account-user-thumb mb-3"
                    alt="user"
                  />
                  <div class="text-center">
                    <h6 class="fw-bold">Ethan Carter</h6>
                    <h6 class="fw-normal txt-user">ethan.carter@email.com</h6>
                  </div>
                </div>
              </div>
              <div class="row order-3 order-md-3">
                <div class="col-12">
                  <h5 class="fw-bold mb-3">Profile</h5>
                  <div class="container-fluid">
                    <div class="col-12 d-flex justify-content-between mb-4">
                      <span><h6>Notifications</h6></span>
                      <span>
                        <div class="form-check form-switch">
                          <input
                            class="form-check-input"
                            type="checkbox"
                            id="customSwitch"
                            role="switch"
                          />
                          <label
                            class="form-check-label visually-hidden"
                            for="customSwitch"
                            >Toggle switch</label
                          >
                        </div></span
                      >
                    </div>
                    <div class="col-12 d-flex justify-content-between mb-4">
                      <span><h6>Dark Mode</h6></span>
                      <span>
                        <div class="form-check form-switch">
                          <input
                            class="form-check-input"
                            type="checkbox"
                            id="customSwitch"
                            role="switch"
                          />
                          <label
                            class="form-check-label visually-hidden"
                            for="customSwitch"
                            >Toggle switch</label
                          >
                        </div></span
                      >
                    </div>
                    <div class="col-12 d-flex justify-content-between mb-4">
                      <span><h6>Language</h6></span>
                      <span>
                        <div class="d-flex align-items-center cursor-default">
                          <span
                            class="continue-btn rounded-3 fw-medium me-2 px-5 py-2 cursor-default"
                          >
                            العربية
                          </span>
                          <span
                            class="upload-btn rounded-3 fw-medium px-3 py-2 shadow-0 cursor-default"
                          >
                            English
                          </span>
                        </div></span
                      >
                    </div>
                  </div>
                </div>
                <div class="col-12 mb-4">
                  <h5 class="fw-bold mb-3">Support</h5>
                  <div class="container-fluid">
                    <div class="col-12 d-flex justify-content-between mb-4">
                      <span><h6>Contact Us</h6></span>
                      <span>
                        <a href="" class="txt-dark"
                          ><i class="fa-solid fa-arrow-right"></i></a
                      ></span>
                    </div>
                    <div class="col-12 d-flex justify-content-between mb-4">
                      <span><h6>Terms of Service</h6></span>
                      <span>
                        <a href="" class="txt-dark"
                          ><i class="fa-solid fa-arrow-right"></i></a
                      ></span>
                    </div>
                    <div class="col-12 d-flex justify-content-between mb-4">
                      <span><h6>Privacy Policy</h6></span>
                      <span>
                        <a href="" class="txt-dark"
                          ><i class="fa-solid fa-arrow-right"></i></a
                      ></span>
                    </div>
                  </div>
                </div>
                <div class="text-end">
                  <button
                    class="upload-btn rounded-3 fw-medium px-4 py-3 shadow-0 cursor-default"
                  >
                    Save Changes
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="master.js"></script>
  </body>
</html>
