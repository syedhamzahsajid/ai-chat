<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>upload audio</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-3 bg-white">
          <!-- sidenav -->
        </div>
        <div class="col-12 col-md-7 col-lg-9 bg-chat">
          <form action="">
            <div class="container-fluid p-30">
              <h2 class="fw-medium mb-4">Upload your audio file</h2>
              <h6 class="bw-bold table-file-reading mb-3">
                Browse to upload your audio file. Supported formats: MP3, WAV,
                AAC.
              </h6>
              <div class="row justify-content-center">
                <div class="col-12 col-md-10 bg-white rounded-4 p-3 mb-4">
                  <div class="drop-zone p-5" id="drop-zone">
                    <h6 class="text-center mb-3 fw-bold">
                      Drag and drop or browse
                    </h6>
                    <p class="mb-3 text-center fw-normal">
                      Upload your audio file here. Supported formats: MP3, WAV,
                      AAC.
                    </p>
                    <input type="file" id="fileInput" />
                    <div class="d-flex justify-content-center">
                      <div
                        class="preview continue-btn rounded-3 fw-bold"
                        id="filePreview"
                      >
                        Browse Files
                      </div>
                    </div>
                  </div>
                </div>
                <h5 class="fw-bold">Recent Files</h5>
                <div class="container py-4"></div>
              </div>
              <div class="row">
                <div class="col-12 col-md-6 mb-3">
                  <label
                    for="exampleFormControlInput1"
                    class="form-label d-none"
                    >File Name</label
                  >
                  <input
                    type="email"
                    class="form-control upload-audio-input"
                    id="exampleFormControlInput1"
                    placeholder="File Name"
                  />
                </div>
                <div class="col-12 col-md-6 mb-3">
                  <select
                    class="form-select"
                    aria-label="Default select example"
                  >
                    <option selected>Audio Select</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                  </select>
                </div>
                <div class="col-12 col-md-6 mb-3">
                  <select
                    class="form-select"
                    aria-label="Default select example"
                  >
                    <option selected>Choose Output Type</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                  </select>
                </div>
                <div class="col-12 col-md-6 mb-3">
                  <select
                    class="form-select"
                    aria-label="Default select example"
                  >
                    <option selected>Choose Output Format</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                  </select>
                </div>
              </div>
              <button class="upload-btn mb-3 mt-4 rounded-4">Process</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="master.js"></script>
  </body>
</html>
