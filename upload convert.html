<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>upload Convert</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-3 bg-white">
          <!-- sidenav -->
        </div>
        <div class="col-12 col-md-7 col-lg-9 bg-chat">
          <form action="">
            <div class="container-fluid p-30">
              <h2 class="fw-medium mb-4">Convert</h2>
              <h6 class="bw-bold table-file-reading mb-3">
                Browse to upload your media, select any format, and convert to
                MP3 or MP4.
              </h6>
              <div class="row justify-content-center p-2">
                <div class="col-12 bg-white rounded-4 p-3 mb-4">
                  <div class="drop-zone p-5" id="drop-zone">
                    <h6 class="text-center mb-3 fw-bold">
                      Drag and drop or browse
                    </h6>
                    <p class="mb-3 text-center fw-normal">
                      Browse to upload your media files to convert them...
                    </p>
                    <input type="file" id="fileInput" />
                    <div class="d-flex justify-content-center">
                      <div
                        class="preview continue-btn rounded-3 fw-bold"
                        id="filePreview"
                      >
                        Browse Files
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-12 mb-3">
                  <div class="dropdown bg-transparent border-0 outline-0 w-100">
                    <button
                      class="form-select w-100 text-start d-flex align-items-center justify-content-between py-4"
                      type="button"
                      id="audioDropdownBtn"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                      style="height: 60px"
                    >
                      <div class="d-flex align-items-center">
                        <img src="" class="img-fluid me-2" id="selectedIcon" />
                        <span id="selectedText" class=""
                          >Choose Output Format</span
                        >
                      </div>
                      <i class="bi bi-chevron-down me-2"></i>
                    </button>

                    <ul
                      class="dropdown-menu w-100 shadow-sm"
                      aria-labelledby="audioDropdownBtn"
                    >
                      <li>
                        <a
                          class="dropdown-item d-flex align-items-center"
                          href="#"
                          data-value="mp3"
                          data-icon="imgs/mp3-ico.svg"
                        >
                          <img
                            src="imgs/mp3-ico.svg"
                            alt="mp3"
                            class="img-fluid me-2"
                            width="40"
                          />
                          Mp3
                        </a>
                      </li>
                      <li>
                        <a
                          class="dropdown-item d-flex align-items-center"
                          href="#"
                          data-value="mp4"
                          data-icon="imgs/mp4-ico.svg"
                        >
                          <img
                            src="imgs/mp4-ico.svg"
                            alt="mp4"
                            class="img-fluid me-2"
                            width="40"
                          />
                          Mp4
                        </a>
                      </li>
                    </ul>
                  </div>

                  <!-- Hidden input to act like select -->
                  <input type="hidden" name="audio_format" id="audioInput" />
                </div>
              </div>
              <div class="text-center">
                <button class="upload-btn mb-3 mt-4 rounded-4 no-shadow">
                  Convert
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="master.js"></script>
  </body>
</html>
