<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Processing</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-fluid">
      <!-- *************************two row *************************** -->
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-3 bg-white">
          <!-- sidenav -->
        </div>
        <div
          class="col-12 col-md-7 col-lg-9 bg-chat min-h-100 d-flex justify-content-center align-items-center"
        >
          <!-- Modal -->
          <div
            class="modal fade"
            id="exampleModal"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content r-modal-content">
                <div class="modal-body">
                  <div class="carusal-card carusal-card-modal mb-5">
                    <div class="container-fluid">
                      <div class="row">
                        <div class="col-12 text-center mb-3">
                          <h6 class="fw-bold">Ready for download</h6>
                        </div>
                        <div class="border mb-3"></div>
                        <div class="col-12 text-center fw-medium">
                          <div
                            class="d-flex justify-content-center mb-4 processing-img-ico"
                          >
                            <img
                              src="imgs/pdf-ico.svg"
                              alt="pdf"
                              class="img-fluid me-4 modal-ico"
                            />
                            <img
                              src="imgs/pdf-ico.svg"
                              alt="pdf"
                              class="img-fluid me-4 modal-ico"
                            />
                            <img
                              src="imgs/pdf-ico.svg"
                              alt="pdf"
                              class="img-fluid me-4 modal-ico"
                            />
                            <img
                              src="imgs/pdf-ico.svg"
                              alt="pdf"
                              class="img-fluid me-4 modal-ico"
                            />
                            <!-- <img
                              src="imgs/doc-ico.png"
                              alt="doc"
                              class="img-fluid me-4"
                            />
                            <img
                              src="imgs/txt-ico.png"
                              alt="text"
                              class="img-fluid me-4"
                            />
                            <img
                              src="imgs/md-ico.png"
                              alt="md"
                              class="img-fluid"
                            /> -->
                          </div>
                        </div>
                        <div class="col-12 rounded-3 text-center">
                          <div class="container-fluid">
                            <div class="row justify-content-center">
                              <div class="col-10 col-xxl-5 mb-3">
                                <button
                                  class="send-btn w-100 continue-btn-modal"
                                  style="font-size: 14px"
                                >
                                  Document Download
                                </button>
                              </div>
                            </div>
                            <div class="row justify-content-center">
                              <div class="col-10 col-xxl-5">
                                <button
                                  class="continue-btn"
                                  style="font-size: 14px"
                                >
                                  Go to My Documents
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="container-fluid p-30">
            <div class="row">
              <div class="text-center">
                <img src="imgs/ico-ai-big.png" class="img-fluid" alt="ai" />
              </div>
              <h4 class="fw-bold mb-4 text-center">Successfully processed!</h4>

              <h6 class="text-center">
                We have successfully processed your media file into a readable
                document.
              </h6>
              <h6 class="fw-bold mb-3">Completed!</h6>
              <div class="col-12 mb-3">
                <div
                  class="progress"
                  role="progressbar"
                  aria-label="Basic example"
                  aria-valuenow="100"
                  aria-valuemin="0"
                  aria-valuemax="100"
                >
                  <div class="progress-bar w-100"></div>
                </div>
              </div>
              <p class="txt-user mb-4">Processing successful</p>
              <div class="text-center">
                <button
                  data-bs-toggle="modal"
                  data-bs-target="#exampleModal"
                  class="process-comp-btn"
                >
                  View Results
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- *************************two row *************************** -->
      <!-- *************************one row *************************** -->
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-3 bg-white">
          <!-- sidenav -->
        </div>
        <div
          class="col-12 col-md-7 col-lg-9 bg-chat min-h-100 d-flex justify-content-center align-items-center"
        >
          <div class="container-fluid p-30">
            <div class="row">
              <div class="text-center">
                <img src="imgs/ico-ai-big.png" class="img-fluid" alt="ai" />
              </div>
              <h4 class="fw-bold mb-4 text-center">Processing...</h4>

              <h6 class="text-center">
                We are processing your audio file into a readable document.
              </h6>
              <h6 class="fw-bold mb-3">Processing...</h6>
              <div class="col-12 mb-3">
                <div
                  class="progress"
                  role="progressbar"
                  aria-label="Basic example"
                  aria-valuenow="75"
                  aria-valuemin="0"
                  aria-valuemax="100"
                >
                  <div class="progress-bar w-75"></div>
                </div>
              </div>
              <p class="txt-user mb-4">This may take a few minutes</p>
              <div class="text-center">
                <button class="process-uncomp-btn">View Results</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- *************************one row *************************** -->
    </div>
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="master.js"></script>
  </body>
</html>
