<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>My Documents</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-3 bg-white">
          <!-- sidenav -->
        </div>
        <div class="col-12 col-md-7 col-lg-9 bg-chat">
          <div class="container-fluid p-30">
            <div class="d-flex justify-content-between">
              <span> <h2 class="fw-medium mb-4">My Documents</h2></span>
              <span>
                <div class="add-folder-trigger">
                  <img src="imgs/add-folder.svg" class="img-fluid" alt="" />
                  <div class="position-relative">
                    <div class="carusal-card create-folder-abs">
                      <div class="container-fluid create-folder-abs-w">
                        <div class="row">
                          <div class="col-12 text-center mb-3">
                            <h6 class="fw-bold">Create folder</h6>
                          </div>
                          <div class="border mb-3"></div>
                          <div class="col-12">
                            <div class="mb-3">
                              <label
                                for="exampleFormControlInput1"
                                class="form-label"
                                >Folder Name</label
                              >
                              <input
                                type="email"
                                class="form-control"
                                id="exampleFormControlInput1"
                                placeholder="My Folder"
                              />
                            </div>
                          </div>
                          <div class="col-12 rounded-3 text-center">
                            <div class="container-fluid">
                              <div class="row justify-content-center">
                                <div class="col-12 mb-2">
                                  <button
                                    class="send-btn fw-bold w-100"
                                    style="font-size: 16px"
                                  >
                                    Create
                                  </button>
                                </div>
                                <div class="col-12">
                                  <button
                                    class="continue-btn fw-bold"
                                    style="font-size: 16px"
                                  >
                                    Cancel
                                  </button>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div></span
              >
            </div>
            <div class="row bg-search-bar mb-3">
              <div class="d-flex align-items-center">
                <span>
                  <img src="imgs/mag.svg" class="img-fluid me-2" alt="mag"
                /></span>
                <span class="w-100">
                  <input
                    type="text"
                    class="Search-bar"
                    id="exampleFormControlInput1"
                    placeholder="Search files"
                /></span>
              </div>
            </div>
            <div class="row text-end">
              <div class="dropdown">
                <button
                  class="btn-3"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <div class="d-flex align-items-center">
                    <span> Sort by</span>
                    <span class="ms-3"
                      ><img
                        src="imgs/chev-down.svg"
                        class="chevron img-fluid"
                        alt="chev"
                    /></span>
                  </div>
                </button>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Date</a></li>
                  <li><a class="dropdown-item" href="#">Name</a></li>
                  <li><a class="dropdown-item" href="#">Size</a></li>
                  <li><a class="dropdown-item" href="#">Format</a></li>
                </ul>
              </div>
            </div>
            <div class="row">
              <div class="container py-4">
                <div class="table-responsive border-2 shadow-sm">
                  <table class="table table-hover align-middle mb-0">
                    <thead>
                      <tr>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Minutes</th>
                        <th class="text-end table-file-reading pe-5">
                          Actions
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              src="imgs/doc-new-ico.svg"
                              alt="doc"
                              class="file-icon"
                            />
                            <span class="table-file-name">Meeting Notes</span>
                          </div>
                        </td>
                        <td class="table-file-reading">2024-01-15</td>
                        <td class="table-file-reading">2.5 MB</td>
                        <td class="text-end action-btns">
                          <a href=""
                            ><img
                              src="imgs/download.svg"
                              title="Download"
                              alt="download"
                              class="img-fluid me-3"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/eye.svg"
                              alt="eye"
                              title="View"
                              class="img-fluid me-3"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/del.svg"
                              alt="delete"
                              title="Delete"
                              class="img-fluid"
                          /></a>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              src="imgs/pdf-new-ico.svg"
                              alt="pdf"
                              class="file-icon"
                            />
                            <span class="table-file-name">Meeting Notes</span>
                          </div>
                        </td>
                        <td class="table-file-reading">2024-01-15</td>
                        <td class="table-file-reading">2.5 MB</td>
                        <td class="text-end action-btns">
                          <a href=""
                            ><img
                              src="imgs/download.svg"
                              title="Download"
                              alt="download"
                              class="img-fluid me-3"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/eye.svg"
                              alt="eye"
                              title="View"
                              class="img-fluid me-3"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/del.svg"
                              alt="delete"
                              title="Delete"
                              class="img-fluid"
                          /></a>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              src="imgs/txt-new-ico.svg"
                              alt="txt"
                              class="file-icon"
                            />
                            <span class="table-file-name">Meeting Notes</span>
                          </div>
                        </td>
                        <td class="table-file-reading">2024-01-15</td>
                        <td class="table-file-reading">2.5 MB</td>
                        <td class="text-end action-btns">
                          <a href=""
                            ><img
                              src="imgs/download.svg"
                              title="Download"
                              alt="download"
                              class="img-fluid me-3"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/eye.svg"
                              alt="eye"
                              title="View"
                              class="img-fluid me-3"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/del.svg"
                              alt="delete"
                              title="Delete"
                              class="img-fluid"
                          /></a>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              src="imgs/md-new-ico.svg"
                              alt="md"
                              class="file-icon"
                            />
                            <span class="table-file-name">Meeting Notes</span>
                          </div>
                        </td>
                        <td class="table-file-reading">2024-01-15</td>
                        <td class="table-file-reading">2.5 MB</td>
                        <td class="text-end action-btns">
                          <a href=""
                            ><img
                              src="imgs/download.svg"
                              title="Download"
                              alt="download"
                              class="img-fluid me-3"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/eye.svg"
                              alt="eye"
                              title="View"
                              class="img-fluid me-3"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/del.svg"
                              alt="delete"
                              title="Delete"
                              class="img-fluid"
                          /></a>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
              <div class="text-center">
                <nav>
                  <ul class="pagination">
                    <li class="page-item">
                      <a class="page-link" href="#" aria-label="Previous">
                        <i class="fa-solid fa-chevron-left"></i>
                      </a>
                    </li>
                    <li class="page-item active">
                      <a class="page-link" href="#">1</a>
                    </li>
                    <li class="page-item">
                      <a class="page-link" href="#">2</a>
                    </li>
                    <li class="page-item">
                      <a class="page-link" href="#">3</a>
                    </li>
                    <li class="page-item">
                      <a class="page-link" href="#">4</a>
                    </li>
                    <li class="page-item">
                      <a class="page-link" href="#">5</a>
                    </li>
                    <li class="page-item disabled">
                      <span class="ellipsis">…</span>
                    </li>
                    <li class="page-item">
                      <a class="page-link" href="#">10</a>
                    </li>
                    <li class="page-item">
                      <a class="page-link" href="#" aria-label="Next">
                        <i class="fa-solid fa-chevron-right"></i>
                      </a>
                    </li>
                  </ul>
                </nav>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="master.js"></script>
  </body>
</html>
