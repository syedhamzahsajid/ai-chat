<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Onboarding</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-3 bg-white">
          <!-- sidenav -->
        </div>
        <div class="col-12 col-md-7 col-lg-9 bg-chat">
          <div class="container-fluid p-30">
            <h2 class="fw-medium mb-4">Welcome, John Smith</h2>
            <div class="row justify-content-center">
              <div class="col-12 col-md-8 bg-chat-3 rounded-4 p-3 mb-4">
                <h6 class="bw-bold text-center mb-3">
                  Convert all type of audio files to text
                </h6>
                <button class="upload-btn w-100 mb-3">
                  <span class="me-2"
                    ><img src="imgs/stars-white.png" class="img-fluid" alt=""
                  /></span>
                  Upload Media
                </button>
              </div>
              <h5 class="fw-bold">Recent Files</h5>
              <div class="container py-4">
                <div class="table-responsive shadow-sm">
                  <table class="table table-hover align-middle mb-0">
                    <thead>
                      <tr>
                        <th>Name</th>
                        <th>Last Modified</th>
                        <th>Size</th>
                        <th class="text-end pe-5">Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              src="imgs/pdf-ico.png"
                              alt="pdf"
                              class="file-icon"
                            />
                            <span class="table-file-name">Meeting Notes</span>
                          </div>
                        </td>
                        <td class="table-file-reading">2024-01-15</td>
                        <td class="table-file-reading">2.5 MB</td>
                        <td class="text-end action-btns">
                          <a href=""
                            ><img
                              src="imgs/download.png"
                              title="Download"
                              alt="download"
                              class="img-fluid me-2"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/eye.png"
                              alt="eye"
                              title="View"
                              class="img-fluid me-2"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/del.png"
                              alt="delete"
                              title="Delete"
                              class="img-fluid"
                          /></a>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              src="imgs/txt-ico.png"
                              alt="txt"
                              class="file-icon"
                            />
                            <span class="table-file-name"
                              >Project Proposal</span
                            >
                          </div>
                        </td>
                        <td class="table-file-reading">2025-01-15</td>
                        <td class="table-file-reading">3.5 MB</td>
                        <td class="text-end action-btns">
                          <a href=""
                            ><img
                              src="imgs/download.png"
                              title="Download"
                              alt="download"
                              class="img-fluid me-2"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/eye.png"
                              alt="eye"
                              title="View"
                              class="img-fluid me-2"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/del.png"
                              alt="delete"
                              title="Delete"
                              class="img-fluid"
                          /></a>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              src="imgs/md-ico.png"
                              alt="md"
                              class="file-icon"
                            />
                            <span class="table-file-name"
                              >Client interview</span
                            >
                          </div>
                        </td>
                        <td class="table-file-reading">2023-02-14</td>
                        <td class="table-file-reading">9.5 MB</td>
                        <td class="text-end action-btns">
                          <a href=""
                            ><img
                              src="imgs/download.png"
                              title="Download"
                              alt="download"
                              class="img-fluid me-2"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/eye.png"
                              alt="eye"
                              title="View"
                              class="img-fluid me-2"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/del.png"
                              alt="delete"
                              title="Delete"
                              class="img-fluid"
                          /></a>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              src="imgs/doc-ico.png"
                              alt="doc"
                              class="file-icon"
                            />
                            <span class="table-file-name">Team Discussion</span>
                          </div>
                        </td>
                        <td class="table-file-reading">2024-12-13</td>
                        <td class="table-file-reading">4 MB</td>
                        <td class="text-end action-btns">
                          <a href=""
                            ><img
                              src="imgs/download.png"
                              title="Download"
                              alt="download"
                              class="img-fluid me-2"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/eye.png"
                              alt="eye"
                              title="View"
                              class="img-fluid me-2"
                          /></a>
                          <a href=""
                            ><img
                              src="imgs/del.png"
                              alt="delete"
                              title="Delete"
                              class="img-fluid"
                          /></a>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="master.js"></script>
  </body>
</html>
