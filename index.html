<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="main-body">
      <div class="container-fluid">
        <div class="row">
          <!-- <div class="col-12">header</div> -->
          <div class="col-12 col-lg-3 bg-white"></div>
          <div class="col-12 col-lg-9 p-3">
            <div class="container-fluid">
              <div class="row">
                <div class="col-12">
                  <div class="bg-chat">
                    <h1 class="fs-32 mb-3 fw-medium">AI chat</h1>
                    <p class="fs-16 mb-3 fw-medium">
                      Ask questions about your audio files or get summaries.
                    </p>
                  </div>
                </div>
                <div class="col-12">
                  <div class="chat-outer">
                    <!-- ai chat  -->
                    <div class="container-fluid mb-50">
                      <div class="row">
                        <div class="col-12 col-lg-8 ai-chat">
                          <div class="container-fluid">
                            <div class="row">
                              <div class="col-md-9 col-12">
                                <div class="d-flex align-items-end">
                                  <span class="me-2">
                                    <img src="imgs/ai.svg" alt="ai ico"
                                  /></span>
                                  <span>
                                    <h1 class="txt-user">Ai Assistant</h1>
                                    <p class="ai-chat-bg m-0">
                                      Lorem ipsum dolor, sit amet consectetur
                                      adipisicing elit. Hic, expedita?
                                    </p></span
                                  >
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <!-- user chat  -->
                    <div class="container-fluid mb-50">
                      <div class="row justify-content-end">
                        <div class="col-12 col-lg-8 ai-chat">
                          <div class="container-fluid">
                            <div class="row justify-content-end">
                              <div class="col-md-9 col-12">
                                <div class="d-flex align-items-end">
                                  <span>
                                    <p class="txt-user text-end">User</p>
                                    <p class="user-chat-bg m-0">
                                      Lorem ipsum dolor, sit amet consectetur
                                      adipisicing elit. Hic, expedita?
                                    </p></span
                                  >
                                  <span class="ms-2">
                                    <img
                                      src="imgs/user.png"
                                      class="img-user"
                                      alt="ai ico"
                                  /></span>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="col-12">
                  <!-- ************************************* -->
                  <div
                    class="container-fluid chat-area-bottom-outer sticky-bottom"
                  >
                    <div class="row justify-content-center">
                      <div class="col-12">
                        <div class="chat-area-bottom">
                          <label for="expanding-textarea" class="d-none">
                            Type something:
                          </label>
                          <span><img src="imgs/stars.png" alt="" /></span>
                          <textarea
                            id="expanding-textarea"
                            placeholder="Type your message..."
                            oninput="autoExpand(this)"
                            class="r-textarea"
                          ></textarea>
                          <div class="send-outer">
                            <div class="col-2 pe-0 d-flex align-items-center">
                              <span class="me-md-3 me-1"
                                ><a href=""><img src="imgs/mic.png" alt="" /></a
                              ></span>
                              <button class="send-btn btn">
                                <span class="d-none d-md-block">Send</span>
                                <span class="d-block d-md-none"
                                  ><i class="fa-solid fa-arrow-up"></i
                                ></span>
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
