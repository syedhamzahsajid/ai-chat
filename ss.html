<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create Folder Modal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* Gradient Button */
      .btn-gradient {
        background: linear-gradient(90deg, #8a7aff 0%, #5996ff 100%);
        border: none;
        color: white;
      }

      .btn-gradient:hover {
        background: linear-gradient(90deg, #7766ff 0%, #3a85ff 100%);
      }

      /* Modal styling */
      .modal-content {
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        padding: 20px 25px;
      }

      .modal-header {
        border-bottom: none;
      }

      .folder-icon {
        position: absolute;
        top: -30px;
        right: -30px;
        background-color: #eaf1ff;
        padding: 12px;
        border-radius: 50%;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }

      .folder-icon img {
        width: 24px;
        height: 24px;
      }

      .form-control {
        border-radius: 10px;
      }

      .btn-cancel {
        background: #f1f1f1;
        color: #333;
        border: none;
      }

      .btn-cancel:hover {
        background: #e2e2e2;
      }
    </style>
  </head>
  <body>
    <div class="container py-5 text-center">
      <!-- Trigger Button -->
      <button
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#createFolderModal"
      >
        Create New Folder
      </button>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="createFolderModal"
      tabindex="-1"
      aria-labelledby="createFolderLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content position-relative">
          <!-- Floating Folder Icon -->
          <div class="folder-icon">
            <img
              src="https://img.icons8.com/fluency/48/folder-invoices.png"
              alt="folder icon"
            />
          </div>

          <div class="modal-body text-start mt-4">
            <h5 class="fw-bold mb-3">Create folder</h5>
            <label for="folderName" class="form-label">Folder name</label>
            <input
              type="text"
              id="folderName"
              class="form-control mb-4"
              value="My folder"
            />

            <div class="d-grid gap-2">
              <button class="btn btn-gradient">Create</button>
              <button class="btn btn-cancel" data-bs-dismiss="modal">
                Cancel
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
